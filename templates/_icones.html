{%- endmacro %}

{% macro avatar(user, tam=40) -%}
<span class="avatar" style="width: {{ tam }}px; height: {{ tam }}px">
  {%- if user.foto_tipo -%}<img src="{{ url_for('foto', v=user.foto_versao) }}" alt="" width="{{ tam }}" height="{{ tam }}">
  {%- else -%}{{ icone('usuario', (tam * 0.5)|int) }}{%- endif -%}
</span>
{%- endmacro %}
